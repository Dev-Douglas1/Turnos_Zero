<path d="M370 82H586V376L480 400 370 376Z" fill="#070b12" stroke="#5b5143" stroke-width="8"/>
<path d="M391 105H565V365L480 380 391 365Z" fill="#020509"/>
<path d="M408 119H548V355" fill="none" stroke="#333f48" stroke-width="4"/>
<path d="M410 360L548 360" stroke="#a44e3d" stroke-width="3" opacity=".55"/>

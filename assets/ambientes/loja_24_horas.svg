<path d="M636 49H831" stroke="#b6d8d3" stroke-width="7" opacity=".3"/>
<ellipse cx="246" cy="145" rx="235" ry="135" fill="url(#amber)" filter="url(#blur)"/>
<ellipse cx="776" cy="224" rx="235" ry="170" fill="url(#cold)" filter="url(#blur)"/>
<!-- deep back wall, tile and grime -->
<path d="M0 113H960M0 182H960M0 251H960M0 320H960" stroke="#59636a" stroke-width="2" opacity=".18"/>
<path d="M120 0V385M300 0V405M660 0V405M840 0V390" stroke="#060a10" stroke-width="7" opacity=".4"/>
<path d="M0 106L110 91 140 385 0 385ZM960 92L855 112 820 405 960 385Z" fill="#080d14" opacity=".42"/>

<path d="M0 415L480 474 960 415V540H0Z" fill="url(#tiles)" opacity=".7"/>
<path d="M82 448L290 470M660 468L883 437M350 501L560 526" stroke="#9bb2b4" stroke-width="5" opacity=".09"/>
<path d="M0 0H960V540H0Z" fill="url(#grain)" opacity=".32"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#293038"/><stop offset=".48" stop-color="#151b22"/><stop offset="1" stop-color="#090e15"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#202a30"/><stop offset="1" stop-color="#05080d"/></linearGradient>
 <radialGradient id="amber"><stop stop-color="#dfa65e" stop-opacity=".45"/><stop offset="1" stop-color="#dfa65e" stop-opacity="0"/></radialGradient>
 <radialGradient id="cold"><stop stop-color="#7fb5b0" stop-opacity=".22"/><stop offset="1" stop-color="#7fb5b0" stop-opacity="0"/></radialGradient>
 <pattern id="tiles" width="88" height="48" patternUnits="userSpaceOnUse"><path d="M0 0H88V48H0Z" fill="none" stroke="#5b6263" stroke-opacity=".28" stroke-width="2"/></pattern>
 <pattern id="grain" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M5 4h1M19 18h1M28 8h1M9 29h1" stroke="#d1c0a4" stroke-opacity=".18"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
</defs>
<rect width="960" height="540" fill="#060a10"/>
<path d="M0 0H960V385L480 450 0 385Z" fill="url(#wall)"/>
<path d="M0 385L480 450 960 385V540H0Z" fill="url(#floor)"/>
<path d="M0 385L480 450 960 385" fill="none" stroke="#887257" stroke-width="5" opacity=".55"/>

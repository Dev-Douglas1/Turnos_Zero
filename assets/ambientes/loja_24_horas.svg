<rect x="54" y="120" width="128" height="54" fill="#10171d" stroke="#826949" stroke-width="3"/>
<text x="118" y="143" fill="#d6b576" text-anchor="middle" font-family="monospace" font-size="16" letter-spacing="3">UNIDADE</text>
<text x="118" y="162" fill="#d6b576" text-anchor="middle" font-family="monospace" font-size="13">07 / NORTE</text>
<path d="M740 115H905" stroke="#8f4e40" stroke-width="4" opacity=".75"/>
<text x="822" y="101" fill="#b76b4f" text-anchor="middle" font-family="monospace" font-size="15" letter-spacing="4">ACESSO RESTRITO</text>

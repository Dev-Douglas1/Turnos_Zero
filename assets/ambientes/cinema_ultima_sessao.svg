<path d="M90 24L770 440H250Z" fill="#cfc9b0" opacity=".035"/>
<path d="M110 0L690 430H360Z" fill="#d7cdb7" opacity=".045"/>
<ellipse cx="485" cy="265" rx="330" ry="185" fill="url(#amber)" filter="url(#soft)"/>
<!-- dead wall sconces -->
<path d="M60 145H101V235H60ZM859 145H900V235H859Z" fill="#121219" stroke="#816347" stroke-width="3"/>
<path d="M68 163H93V216H68ZM867 163H892V216H867Z" fill="#b16f40" opacity=".16"/>
<!-- old decorative acoustic panels -->
<g fill="none" stroke="#6b4b4c" stroke-width="3" opacity=".35">
 <path d="M245 140H350V260H245ZM610 140H715V260H610Z"/>
 <path d="M260 155H335V245H260ZM625 155H700V245H625Z"/>
</g>
<!-- aisle and worn carpet -->
<path d="M0 460L480 430 960 460" stroke="#8e6044" stroke-width="6" opacity=".33"/>
<path d="M450 470L510 470 680 540H270Z" fill="#120d15"/>
<path d="M0 0H960V540H0Z" fill="url(#grain)" opacity=".38"/>
<path d="M0 0H960V540H0Z" fill="none" stroke="#020306" stroke-width="50" opacity=".8"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
<defs>
 <linearGradient id="theater" x2="0" y2="1"><stop stop-color="#241923"/><stop offset=".55" stop-color="#151019"/><stop offset="1" stop-color="#07070c"/></linearGradient>
 <linearGradient id="carpet" x2="0" y2="1"><stop stop-color="#332029"/><stop offset="1" stop-color="#09070c"/></linearGradient>
 <radialGradient id="amber"><stop stop-color="#d18a4c" stop-opacity=".43"/><stop offset="1" stop-color="#d18a4c" stop-opacity="0"/></radialGradient>
 <pattern id="grain" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M4 7h1M20 21h2M29 4h1M10 29h1" stroke="#d0bca5" stroke-opacity=".13"/></pattern>
 <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
</defs>
<rect width="960" height="540" fill="#05050a"/>
<path d="M0 0H960V420L480 470 0 420Z" fill="url(#theater)"/>
<path d="M0 420L480 470 960 420V540H0Z" fill="url(#carpet)"/>
<!-- heavy curtains and stage frame, but no projection screen or seats -->
<path d="M0 0H155L188 410H0ZM960 0H805L772 410H960Z" fill="#28141c"/>
<path d="M0 0L110 0 140 410 75 410ZM960 0L850 0 820 410 885 410Z" fill="#471d27" opacity=".38"/>
<path d="M150 0Q210 60 265 0Q320 62 375 0M585 0Q640 60 695 0Q750 60 810 0" stroke="#72404a" stroke-width="16" opacity=".48" fill="none"/>
<path d="M170 52H790" stroke="#78604d" stroke-width="5" opacity=".5"/>
<path d="M180 72H780" stroke="#140e16" stroke-width="12"/>
<!-- empty rear wall with water damage -->
<path d="M200 85H760V380L480 425 200 380Z" fill="#1c2025" stroke="#51413f" stroke-width="5"/>
<path d="M220 105L270 125 250 280 208 300ZM690 115L740 100 752 282 716 300" fill="#090c12" opacity=".42"/>
<path d="M240 330Q310 290 380 335T520 325T720 340" stroke="#6e443b" stroke-width="8" opacity=".22" fill="none"/>

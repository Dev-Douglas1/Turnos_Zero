name: Testes Python
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compilar módulos
        run: python -m py_compile main.py sistemas.py
      - name: Executar testes
        run: python -m unittest discover -s tests -v
      - name: Validar JSONs
        run: |
          python -c "import json; [json.load(open(p, encoding='utf-8')) for p in ['dados/enigmas.json','dados/progresso.json','dados/historico.json']]"

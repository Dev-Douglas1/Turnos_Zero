name: Testes Python
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compilar módulos
        run: python -m py_compile main.py turnos_zero.py scene_manager.py sistemas.py
      - name: Executar testes
        run: python -m unittest discover -s tests -v
      - name: Validar JSON e referências de cenas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ['dados/enigmas.json', 'dados/progresso.json', 'dados/historico.json', 'dados/cenas.json']:
              json.loads(Path(name).read_text(encoding='utf-8'))
          config = json.loads(Path('dados/cenas.json').read_text(encoding='utf-8'))
          for scene in config['scenes']:
              asset = scene.get('background')
              if asset and not Path(asset).is_file():
                  raise SystemExit(f'Asset ausente: {asset}')
          PY

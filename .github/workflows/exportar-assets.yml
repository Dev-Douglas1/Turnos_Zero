name: Exportar cenários PNG

on:
  push:
    branches: [main]
    paths:
      - "assets/ambientes/*.svg"
      - "tools/export_assets.py"
      - ".github/workflows/exportar-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exportar-assets-main
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar CairoSVG
        run: python -m pip install cairosvg
      - name: Exportar PNGs
        run: python tools/export_assets.py
      - name: Validar arquivos PNG
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          for path in Path("assets/ambientes").glob("*.png"):
              data = path.read_bytes()
              if data[:8] != bytes.fromhex('89504e470d0a1a0a'):
                  raise SystemExit(f"PNG inválido: {path}")
              width, height = struct.unpack(">II", data[16:24])
              if (width, height) != (834, 315):
                  raise SystemExit(f"Dimensão incorreta em {path}: {width}x{height}")
              print(f"OK: {path} — {width}x{height}")
          PY
      - name: Publicar PNGs no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ambientes/*.png
          if git diff --cached --quiet; then
            echo "Os PNGs já estão atualizados."
          else
            git commit -m "Exporta cenários do jogo para PNG"
            git pull --rebase origin main
            git push
          fi
